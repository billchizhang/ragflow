<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Change Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .error {
            color: red;
            margin: 10px 0;
        }
        .success {
            color: green;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Password Change Test</h1>
    
    <div id="server-status">
        <h2>Server Status</h2>
        <button id="check-status">Check Server Status</button>
        <pre id="status-result">Click the button to check server status...</pre>
    </div>
    
    <div id="reset-password">
        <h2>Reset Password to Default</h2>
        <p>This will reset the mock user's password to "password"</p>
        <button id="reset-button">Reset Password</button>
        <pre id="reset-result">Click the button to reset password...</pre>
    </div>
    
    <div id="change-password">
        <h2>Change Password</h2>
        <form id="password-form">
            <div>
                <label for="current-password">Current Password:</label>
                <input type="password" id="current-password" value="password">
            </div>
            <div>
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" value="newpassword123">
            </div>
            <button type="submit" id="change-button">Change Password</button>
        </form>
        <div id="change-error" class="error"></div>
        <div id="change-success" class="success"></div>
        <pre id="change-result">Fill the form and submit to change password...</pre>
    </div>
    
    <script>
        // Check server status
        document.getElementById('check-status').addEventListener('click', async () => {
            const resultElement = document.getElementById('status-result');
            resultElement.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/debug/status');
                const data = await response.json();
                resultElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultElement.textContent = `Error: ${error.message}`;
            }
        });
        
        // Reset password
        document.getElementById('reset-button').addEventListener('click', async () => {
            const resultElement = document.getElementById('reset-result');
            resultElement.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/debug/reset-password');
                const data = await response.json();
                resultElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultElement.textContent = `Error: ${error.message}`;
            }
        });
        
        // Change password
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const resultElement = document.getElementById('change-result');
            const errorElement = document.getElementById('change-error');
            const successElement = document.getElementById('change-success');
            
            // Clear previous messages
            errorElement.textContent = '';
            successElement.textContent = '';
            resultElement.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer test-jwt-token'
                    },
                    body: JSON.stringify({
                        currentPassword,
                        newPassword
                    })
                });
                
                const data = await response.json();
                resultElement.textContent = JSON.stringify(data, null, 2);
                
                if (response.ok) {
                    successElement.textContent = data.message || 'Password changed successfully';
                } else {
                    errorElement.textContent = data.message || 'Failed to change password';
                }
            } catch (error) {
                resultElement.textContent = `Error: ${error.message}`;
                errorElement.textContent = error.message;
            }
        });
        
        // Automatically check status on page load
        window.addEventListener('load', () => {
            document.getElementById('check-status').click();
        });
    </script>
</body>
</html>
